name: openai-endpoint

on:
  workflow_dispatch:
    inputs:
      hold_minutes:
        description: "Minutes to keep endpoint alive"
        required: false
        default: "15"

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install Ollama + model
        run: |
          set -e
          curl -fsSL https://ollama.com/install.sh | sh
          export OLLAMA_HOST=0.0.0.0:11434
          export OLLAMA_ORIGINS='*'
          nohup ollama serve >ollama.log 2>&1 &
          echo $! > ollama.pid
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            sleep 1
          done
          ollama pull qwen2.5:0.5b
          curl -fsS http://127.0.0.1:11434/v1/models | head -c 400; echo
          curl -fsS http://127.0.0.1:11434/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"qwen2.5:0.5b","messages":[{"role":"user","content":"ping"}],"max_tokens":8}' \
            | head -c 250; echo

      - name: Public tunnel (localtunnel)
        run: |
          set -e
          sudo npm install -g localtunnel
          # background lt
          nohup lt --port 11434 --print-requests > lt.log 2>&1 &
          echo $! > lt.pid
          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.loca\.lt' lt.log | head -1 || true)
            if [ -z "$URL" ]; then
              URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.localtunnel\.me' lt.log | head -1 || true)
            fi
            if [ -n "$URL" ]; then break; fi
            sleep 2
          done
          echo "PUBLIC_URL=$URL" | tee public_url.txt
          test -n "$URL"
          echo "OpenAI base URL: $URL/v1"
          # localtunnel password page bypass header sometimes needed: bypass-tunnel-reminder
          sleep 3

      - name: Announce + hold
        run: |
          set -e
          HOLD="${{ github.event.inputs.hold_minutes }}"
          HOLD=${HOLD:-15}
          URL=$(cut -d= -f2 public_url.txt)
          echo "======================================================"
          echo "OpenAI-compatible endpoint (ephemeral ~${HOLD} min)"
          echo "  BASE_URL = $URL/v1"
          echo "  MODEL    = qwen2.5:0.5b"
          echo "  NOTE: first request may need header:"
          echo "    bypass-tunnel-reminder: true"
          echo "  curl example:"
          echo "  curl $URL/v1/chat/completions \\"
          echo "    -H 'Content-Type: application/json' \\"
          echo "    -H 'bypass-tunnel-reminder: true' \\"
          echo "    -d '{\"model\":\"qwen2.5:0.5b\",\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}]}'"
          echo "======================================================"
          # keep processes alive
          SECS=$((HOLD * 60))
          END=$((SECONDS + SECS))
          while [ $SECONDS -lt $END ]; do
            kill -0 $(cat ollama.pid) 2>/dev/null || { echo ollama died; exit 1; }
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null || exit 1
            echo "$(date -u +%H:%M:%S)Z still up BASE=$URL/v1 MODEL=qwen2.5:0.5b"
            sleep 30
          done
