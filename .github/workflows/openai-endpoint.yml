name: openai-endpoint

on:
  workflow_dispatch:
    inputs:
      hold_minutes:
        description: "Minutes to keep endpoint alive (max 300)"
        required: false
        default: "300"
  push:
    paths:
      - "TRIGGER"

permissions:
  contents: write

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install Ollama
        run: |
          set -e
          curl -fsSL https://ollama.com/install.sh | sh
          export OLLAMA_HOST=0.0.0.0:11434
          export OLLAMA_ORIGINS='*'
          nohup ollama serve >ollama.log 2>&1 &
          echo $! > ollama.pid
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            sleep 1
          done

      - name: Pull self-hosted model
        run: |
          set -e
          export OLLAMA_HOST=0.0.0.0:11434
          ollama pull qwen2.5:0.5b
          ollama list
          curl -fsS http://127.0.0.1:11434/v1/chat/completions -H 'Content-Type: application/json' -d '{"model":"qwen2.5:0.5b","messages":[{"role":"user","content":"Reply with exactly: GHA_OK"}],"max_tokens":16,"temperature":0}'

      - name: Tunnel and publish URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          sudo npm install -g localtunnel
          nohup lt --port 11434 > lt.log 2>&1 &
          echo $! > lt.pid
          URL=""
          for i in $(seq 1 90); do
            URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.loca\.lt' lt.log | head -1 || true)
            if [ -z "$URL" ]; then URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.localtunnel\.me' lt.log | head -1 || true); fi
            if [ -n "$URL" ]; then break; fi
            sleep 2
          done
          test -n "$URL"
          echo "PUBLIC_URL=$URL" | tee public_url.txt
          echo "BASE_URL=$URL/v1"
          # best-effort publish (do not fail job)
          git config user.name gha-bot
          git config user.email gha-bot@users.noreply.github.com
          git fetch origin || true
          git checkout -B live-endpoint || true
          printf '%s\n' "$URL" > LIVE_BASE_URL.txt
          printf '%s/v1\n' "$URL" > LIVE_OPENAI_BASE.txt
          printf 'qwen2.5:0.5b\n' > LIVE_MODEL.txt
          printf 'LIVE GHA-only\nBASE=%s/v1\nMODEL=qwen2.5:0.5b\n' "$URL" > LIVE_ENDPOINT.md
          git add LIVE_BASE_URL.txt LIVE_OPENAI_BASE.txt LIVE_MODEL.txt LIVE_ENDPOINT.md || true
          git commit -m "live $URL" || true
          git push -f origin live-endpoint || echo "push failed, continuing hold"

      - name: Hold
        run: |
          set -e
          HOLD="${{ github.event.inputs.hold_minutes }}"
          HOLD=${HOLD:-300}
          if [ "$HOLD" -gt 300 ]; then HOLD=300; fi
          URL=$(grep PUBLIC_URL public_url.txt | cut -d= -f2)
          echo "GHA-ONLY $URL/v1 for ${HOLD}m MODEL=qwen2.5:0.5b"
          SECS=$((HOLD * 60))
          END=$((SECONDS + SECS))
          while [ $SECONDS -lt $END ]; do
            kill -0 $(cat ollama.pid) 2>/dev/null || exit 1
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null || exit 1
            echo "$(date -u +%H:%M:%S)Z still up $URL/v1"
            sleep 30
          done
