name: openai-endpoint

# Self-hosted model ONLY on GitHub Actions (no Bedrock, no NEZ).
on:
  workflow_dispatch:
    inputs:
      hold_minutes:
        description: "Minutes to keep endpoint alive (max ~300)"
        required: false
        default: "300"

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install Ollama (self-hosted on this runner)
        run: |
          set -e
          curl -fsSL https://ollama.com/install.sh | sh
          export OLLAMA_HOST=0.0.0.0:11434
          export OLLAMA_ORIGINS='*'
          nohup ollama serve >ollama.log 2>&1 &
          echo $! > ollama.pid
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            sleep 1
          done

      - name: Pull self-hosted model only
        run: |
          set -e
          export OLLAMA_HOST=0.0.0.0:11434
          ollama pull qwen2.5:0.5b
          ollama list
          curl -fsS http://127.0.0.1:11434/v1/models | tee models.json
          curl -fsS http://127.0.0.1:11434/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"qwen2.5:0.5b","messages":[{"role":"user","content":"Reply with exactly: GHA_OK"}],"max_tokens":16,"temperature":0}' \
            | tee local_smoke.json
          echo

      - name: Public tunnel (localtunnel only)
        run: |
          set -e
          sudo npm install -g localtunnel
          nohup lt --port 11434 > lt.log 2>&1 &
          echo $! > lt.pid
          URL=""
          for i in $(seq 1 90); do
            URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.loca\.lt' lt.log | head -1 || true)
            if [ -z "$URL" ]; then
              URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.localtunnel\.me' lt.log | head -1 || true)
            fi
            if [ -n "$URL" ]; then break; fi
            sleep 2
          done
          echo "PUBLIC_URL=$URL" | tee public_url.txt
          echo "BASE_URL=$URL/v1" | tee -a public_url.txt
          echo "MODEL=qwen2.5:0.5b" | tee -a public_url.txt
          test -n "$URL"
          echo "::notice title=OpenAI endpoint::$URL/v1 model=qwen2.5:0.5b"
          echo "### OpenAI endpoint (GHA self-hosted only)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **BASE_URL:** \`$URL/v1\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **MODEL:** \`qwen2.5:0.5b\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Only model:** self-hosted Ollama on this runner (no Bedrock)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Header if needed:** \`bypass-tunnel-reminder: true\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Hold up to 5 hours
        run: |
          set -e
          HOLD="${{ github.event.inputs.hold_minutes }}"
          HOLD=${HOLD:-300}
          if [ "$HOLD" -gt 300 ]; then HOLD=300; fi
          URL=$(grep '^PUBLIC_URL=' public_url.txt | cut -d= -f2)
          echo "======================================================"
          echo "STRICTLY GitHub Actions self-hosted model"
          echo "  BASE_URL = $URL/v1"
          echo "  MODEL    = qwen2.5:0.5b"
          echo "  HOLD     = ${HOLD} minutes"
          echo "  NO Bedrock / NO NEZ proxy"
          echo "======================================================"
          SECS=$((HOLD * 60))
          END=$((SECONDS + SECS))
          while [ $SECONDS -lt $END ]; do
            kill -0 $(cat ollama.pid) 2>/dev/null || { echo ollama died; exit 1; }
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null || exit 1
            echo "$(date -u +%H:%M:%S)Z still up BASE=$URL/v1 MODEL=qwen2.5:0.5b"
            sleep 30
          done
