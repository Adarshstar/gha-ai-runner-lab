name: openai-endpoint

on:
  workflow_dispatch:
    inputs:
      hold_minutes:
        description: "Minutes to keep endpoint alive"
        required: false
        default: "12"

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Install Ollama
        run: |
          set -e
          curl -fsSL https://ollama.com/install.sh | sh
          # start daemon
          ollama serve >ollama.log 2>&1 &
          echo $! > ollama.pid
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags

      - name: Pull fast small model
        run: |
          set -e
          # tiny + fast on CPU; OpenAI API uses this name as model id
          ollama pull qwen2.5:0.5b
          ollama list

      - name: Install cloudflared + public tunnel
        id: tunnel
        run: |
          set -e
          curl -fsSL -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          cloudflared tunnel --url http://127.0.0.1:11434 > tunnel.log 2>&1 &
          echo $! > tunnel.pid
          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' tunnel.log | head -1 || true)
            if [ -n "$URL" ]; then break; fi
            sleep 2
          done
          echo "PUBLIC_URL=$URL" | tee public_url.txt
          test -n "$URL"
          echo "============================================"
          echo "OpenAI-compatible base URL:"
          echo "  $URL/v1"
          echo "Model id: qwen2.5:0.5b"
          echo "============================================"

      - name: Smoke test OpenAI chat completions
        run: |
          set -e
          URL=$(cut -d= -f2 public_url.txt)
          echo "GET $URL/api/tags"
          curl -fsS "$URL/api/tags" | head -c 500; echo
          echo "POST $URL/v1/chat/completions"
          curl -fsS "$URL/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -d '{"model":"qwen2.5:0.5b","messages":[{"role":"user","content":"Reply with exactly: ENDPOINT_OK"}],"max_tokens":32,"temperature":0}' \
            | tee smoke.json
          echo
          python3 - <<'PY'
import json
d=json.load(open("smoke.json"))
print("ASSISTANT:", d["choices"][0]["message"]["content"])
PY

      - name: Hold endpoint
        run: |
          HOLD=${{ github.event.inputs.hold_minutes || '12' }}
          URL=$(cut -d= -f2 public_url.txt)
          echo "LIVE OpenAI endpoint for ~${HOLD} min:"
          echo "  BASE: $URL/v1"
          echo "  MODEL: qwen2.5:0.5b"
          echo "curl example:"
          echo "curl $URL/v1/chat/completions -H 'Content-Type: application/json' -d '{\"model\":\"qwen2.5:0.5b\",\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}]}'"
          SECS=$((HOLD * 60))
          END=$((SECONDS + SECS))
          while [ $SECONDS -lt $END ]; do
            kill -0 $(cat ollama.pid) 2>/dev/null || { echo ollama died; exit 1; }
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null || exit 1
            echo "$(date -u +%H:%M:%S)Z still up $URL/v1"
            sleep 30
          done
