name: openai-endpoint

on:
  workflow_dispatch:
    inputs:
      hold_minutes:
        description: "Minutes to keep endpoint alive"
        required: false
        default: "12"
  push:
    paths:
      - ".github/workflows/openai-endpoint.yml"

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Install Ollama
        run: |
          set -e
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve >ollama.log 2>&1 &
          echo $! > ollama.pid
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags

      - name: Pull fast small model
        run: |
          set -e
          ollama pull qwen2.5:0.5b
          ollama list

      - name: Install cloudflared + public tunnel
        run: |
          set -e
          curl -fsSL -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          cloudflared tunnel --url http://127.0.0.1:11434 > tunnel.log 2>&1 &
          echo $! > tunnel.pid
          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' tunnel.log | head -1 || true)
            if [ -n "$URL" ]; then break; fi
            sleep 2
          done
          echo "PUBLIC_URL=$URL" | tee public_url.txt
          test -n "$URL"
          echo "OpenAI base URL: $URL/v1"
          echo "Model: qwen2.5:0.5b"

      - name: Smoke test
        run: |
          set -e
          URL=$(cut -d= -f2 public_url.txt)
          curl -fsS "$URL/api/tags" | head -c 400; echo
          curl -fsS "$URL/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -d '{"model":"qwen2.5:0.5b","messages":[{"role":"user","content":"Reply with exactly: ENDPOINT_OK"}],"max_tokens":32,"temperature":0}' \
            | tee smoke.json
          echo
          python3 -c "import json;d=json.load(open('smoke.json'));print('ASSISTANT:',d['choices'][0]['message']['content'])"

      - name: Hold endpoint
        run: |
          HOLD=12
          if [ -n "${{ github.event.inputs.hold_minutes }}" ]; then HOLD="${{ github.event.inputs.hold_minutes }}"; fi
          URL=$(cut -d= -f2 public_url.txt)
          echo "LIVE: $URL/v1  model=qwen2.5:0.5b  for ${HOLD}m"
          SECS=$((HOLD * 60))
          END=$((SECONDS + SECS))
          while [ $SECONDS -lt $END ]; do
            kill -0 $(cat ollama.pid) 2>/dev/null || exit 1
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null || exit 1
            echo "$(date -u +%H:%M:%S)Z still up $URL/v1"
            sleep 30
          done
